  # ─── Grant Permission ─────────────────────────────────
  /grantpermission:
    post:
      tags: [GrantPermission]
      summary: OAuth flow for Google Drive permission
      description: |
        Handles the OAuth2 flow for granting Google Drive permissions.
        - If `token` and `code` are provided, completes the OAuth flow.
        - Otherwise, returns an authorization URL to start the flow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, file]
              properties:
                token:
                  type: string
                  description: Existing OAuth token (optional)
                code:
                  type: string
                  description: OAuth authorization code (optional)
                email:
                  type: string
                  format: email
                file:
                  type: string
                  description: Google Drive file ID
      responses:
        '200':
          description: Permission granted or auth URL returned
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      message:
                        type: string
                        example: Success!
                      token:
                        type: string
                  - type: object
                    properties:
                      url:
                        type: string
                        format: uri
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /grantpermission/googleDrive:
    post:
      tags: [GrantPermission]
      summary: Grant Google Drive permission directly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, file]
              properties:
                email:
                  type: string
                  format: email
                file:
                  type: string
                  description: Google Drive file ID
      responses:
        '200':
          description: Permission granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success!
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /grantpermission/gitHub:
    post:
      tags: [GrantPermission]
      summary: Onboard user to GitHub org and team
      description: |
        Invites user to the GitHub organization and adds them to a team.
        Requires JWT authentication.
      security:
        - CustomHeader: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamName, handle]
              properties:
                teamName:
                  type: string
                  description: GitHub team slug
                handle:
                  type: string
                  description: GitHub username
      responses:
        '200':
          description: GitHub onboarding result
          content:
            application/json:
              schema:
                type: object
                properties:
                  orgMembershipStatus:
                    type: string
                    description: Organization membership status
                  teamMembershipStatus:
                    type: string
                    description: Team membership status
                  publicMembership:
                    type: string
                    description: Public membership visibility (if applicable)
                  twoFAenabled:
                    type: boolean
                    description: Whether 2FA is enabled (if applicable)
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── Health Check ──────────────────────────────────────
  /healthcheck:
    get:
      tags: [HealthCheck]
      summary: Service health check
      description: |
        Returns service status with build info. Does NOT require the custom header.
        Build info is sourced from BUILD_SHA env var, BUILD_INFO file, or git SHA.
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            text/plain:
              schema:
                type: string
                example: "I'm Alive! Build: abc1234 | Built: 2024-01-01T00:00:00Z | Checked: 2024-01-01T00:00:00Z"
