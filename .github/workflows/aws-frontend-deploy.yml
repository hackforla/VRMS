name: Frontend Build and Deploy
on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        description: 'AWS Incubator Env'
        options:
          - dev
          - prod
      ref:
        description: 'Branch, Tag, or SHA'
        required: true
env:
  AWS_SHARED_CLUSTER: incubator-prod
  AWS_APP_NAME: vrms-client # vrms-frontend
  AWS_REGION: us-west-2
  DOCKERFILE: client/Dockerfile.prod # Dockerfile.prod
  DOCKER_PATH: client
jobs:
  setup_env:
    name: Set-up environment
    runs-on: ubuntu-latest
    steps:
      - name: Debug Action
        uses: hmarr/debug-action@v2
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
      - name: Set AWS Env & Image Tag per workflow
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              INPUT_ENV=${{ github.event.inputs.env }}; INPUT_REF=${{ github.event.inputs.ref }}
              echo AWS_APPENV="$AWS_APP_NAME"-$INPUT_ENV >> $GITHUB_ENV
              echo IMAGE_TAG=$SHORT_SHA >> $GITHUB_ENV
          fi
    outputs:
      AWS_APPENV: ${{ env.AWS_APPENV }}
      IMAGE_TAG: ${{ env.IMAGE_TAG }}
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [setup_env]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.ref }}
      - name: Checkout
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.INCUBATOR_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INCUBATOR_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Init Docker Cache
        uses: jpribyl/action-docker-layer-caching@v0.1.1
        with:
          key: ${{ github.workflow }}-2-{hash}
          restore-keys: |
            ${{ github.workflow }}-2-
      - name: Build, tag, and push the image to Amazon ECR
        id: build-push-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.AWS_APP_NAME }}
        run: |
          ls
          cd ./${{ env.DOCKER_PATH }}
          docker build \
            -f ${{ env.DOCKERFILE }} \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.setup_env.outputs.IMAGE_TAG }} \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:test \
            .
          docker image push --all-tags ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
  deploy:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: [setup_env, build]
    permissions:
      id-token: write
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        role-to-assume: arn:aws:iam::035866691871:role/incubator-cicd-vrms
        role-session-name: incubator-cicd-vrms-gha
        aws-region: us-west-2
    - name: Restart ECS Service
      id: redeploy-service
      env:
        SERVICE_NAME: ${{env.AWS_APP_NAME}}-${{ github.event.inputs.env }}
      run: |
        aws ecs update-service --force-new-deployment --service $SERVICE_NAME --cluster $AWS_SHARED_CLUSTER
